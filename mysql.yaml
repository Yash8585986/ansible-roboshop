- name: configure mysqld
  hosts: mysql
  become: yes 
  tasks:
    - name: install mysql
      ansible.builtin.dnf:
        name: mysql-server
        state: present 

    - name: start mysqld service 
      ansible.builtin.service:
        name: mysqld
        enabled: yes 
        start: restarted

    - name: change default password
      ansible.builtin.command: mysql_secure_installation --set-root-pass RoboShop@1