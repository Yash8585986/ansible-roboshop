- name: "Configure catalogue"
  hosts: catalogue
  become: yes 
  tasks:  
    - name : "enable nodejs 20"
      ansible.builtin.command: dnf module enable nodejs:20 -y

    - name : "install node js"
      ansible.builtin.dnf:
        name: nodejs:20
        state: present 
    - name: "create systsem user roboshop"
      ansible.builtin.user:
        name: roboshop
        system: yes
        home: /app
        shell: /sbin/nologin
        comment: "roboshop system user"

    - name: "Delete folder"
      ansible.builtin.file:
        path: /app
        state: absent

    - name: "create home directory"
      ansible.builtin.file:
        path: /app
        state: directory
    
    - name: "delete code"
      ansible.builtin.file:
        path: /tmp/catalogue.zip
        state: absent
    
    - name: "download code from source"
      ansible.builtin.get_url:
        url: 'https://roboshop-artifacts.s3.amazonaws.com/catalogue.zip'
        dest: /tmp/catalogue.zip

    - name: "Unzip code"
      ansible.builtin.unarchive:
        src: /tmp/catalogue.zip
        dest: /app

    - name: "install npm dependencies"
      community.general.npm:
        path: /app
    
    - name: "Copy file with owner and permissions"
      ansible.builtin.copy:
        src: catalogue.service
        dest: /etc/systemd/system/catalogue.service

    - name: "load mongodb schema"
      ansible.builtin.copy:
        src: mongo.repo
        dest: /etc/yum.repos.d/mongo.repo

    - name: "install mongodb"
      ansible.builtin.dnf:
        name: mongodb-mongosh
        state: present

    - name: check products loaded
      ansible.builtin.command: mongosh --host "{{ MONGODB_HOST }}" --quiet  --eval 'db.getMongo().getDBNames().indexOf("catalogue")'
      register: catalogue_output

    - name: print the output
      ansible.builtin.debug:
          msg: "{{ catalogue_output }}"

    - name: load the products
      ansible.builtin.shell: mongosh --host "{{ MONGODB_HOST }}" </app/db/master-data.js
      when: catalogue_output.stdout  | int < 0

    - name: start catalogue
      ansible.builtin.service:
        name: catalogue
        state: restarted
        enabled: yes

