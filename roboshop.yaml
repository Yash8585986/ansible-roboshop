- name: "Create ec2 instances and r53 records"
  hosts: all
  connection: local
  vars:
    ami_id: "ami-0220d79f3f480ecf5"
    sg_id: "sg-03ca0ca07c63fb908"
    instance_type: "t3.micro"
    domain_id: "ramyaboutique.shop"
    area: "dev"
    instances:
      - mongodb
      - catalogue

  tasks:
  - name: "Create ec2 instances"
    amazon.aws.ec2_instance:
      instance_type: "{{ instance_type }}"
      image_id: "{{ ami_id }}"
      security_group: "{{ sg_id }}"
      name: "{{ item }} - {{ area }}"
      tags:
        Project: roboshop
        Component: "{{ item }}"
        Environment: "{{ area }}"
        name: "{{ item }} - {{ area }}"
    loop: "{{ instances }}"
    register: ec2_output

  - name: "print the output"
    ansible.builtin.debug:
      msg: "{{ ec2_output }}"

  - name: Add new.foo.com as an A record with 3 IPs and wait until the changes have been replicated
    amazon.aws.route53:
      state: present
      zone: "{{ domain_id }}"
      record: "{{ item.item }}-{{ area }}.{{ domain_id }}"
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}"
      wait: true
    loop: "{{ ec2_output.results }}"

      
    

