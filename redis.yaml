- name: "configure ,redis"
  hosts: redis
  become: yes
  tasks:
    - name: "enable redis"
      ansible.builtin.command: dnf module enable redis:7 -y

    - name: "install redis"
      ansible.builtin.dnf:
        name: redis
        state: present
    
    - name: "Allow all connections"
      ansible.builtin.replace:
        path: /etc/redis/redis.conf
        regexp: '127.0.0.1'
        replace: '0.0.0.0'  

    

      